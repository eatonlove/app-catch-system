name: Verify
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -e '.[cloud]'
      - run: python -m unittest discover -s tests -v
      - run: node --check app_catch/static/app.js && node --check app_catch/static/lab.js
      - run: for script in deploy/mac/*.sh deploy/cloud/*.sh; do bash -n "$script"; done
      - run: PYTHONPATH=.:tests python tests/verify_postgres.py
      - run: docker build -f deploy/cloud/Dockerfile -t appcatch-verification .
